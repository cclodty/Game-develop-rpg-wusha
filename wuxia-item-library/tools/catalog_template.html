<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>江湖藏物誌 · 武俠物品圖鑑</title>
<style>
:root{--paper:#f6f0e3;--card:#fffcf5;--ink:#283d34;--muted:#68756c;--jade:#35644f;--border:#dcd9c8;--gold:#ac7e39;--shadow:0 7px 22px #344c3620}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ad7935;outline-offset:3px}a{color:var(--jade)}header{padding:48px 6vw 34px;background:#173e31;color:#f7f0df;position:relative;overflow:hidden}header:after{content:"藏";position:absolute;right:5vw;top:-80px;font-family:serif;font-size:290px;color:#ffffff06;pointer-events:none}.eyebrow{letter-spacing:.24em;font-size:12px;color:#d7c591}h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(30px,4vw,46px);font-weight:600;letter-spacing:.08em;margin:8px 0}header p{max-width:850px;color:#dbdfcf;margin:10px 0}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.stats span{border:1px solid #819b7755;border-radius:5px;padding:7px 15px;font-size:14px}.stats strong{font-size:21px;color:#f7e0ac;margin-right:6px}main{max-width:1500px;margin:auto;padding:26px 5vw 50px}.toolbar{background:var(--card);padding:20px;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr 1fr;gap:14px}label{display:block;font-size:12px;font-weight:650;color:var(--muted)}input,select{display:block;width:100%;border:1px solid var(--border);border-radius:6px;background:#fffef9;color:var(--ink);padding:10px;margin-top:5px;min-height:44px}input::placeholder{color:#859184}.toolbar-bottom{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;padding-top:15px;font-size:13px}.reset{border:0;background:transparent;color:var(--jade);text-decoration:underline;padding:5px 8px}.profile{margin:18px 0 0;padding:16px 20px;border-left:3px solid var(--gold);background:#ecead9;border-radius:0 8px 8px 0;font-size:14px}.profile strong{color:var(--jade)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:18px;margin-top:24px}.item{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:transform .15s,box-shadow .15s}.item:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.open-item{display:block;border:0;background:none;width:100%;text-align:left;padding:0;color:inherit}.thumb{width:100%;aspect-ratio:1;display:grid;place-items:center;background-color:#eeefdf;background-image:radial-gradient(#fffefb88 1px,transparent 1px);background-size:12px 12px;color:#8d9b8d;border-bottom:1px solid #e2e1d4;position:relative}.thumb.generated{background-repeat:no-repeat;background-color:#f2f1e7;background-size:400% 400%}.placeholder{text-align:center;font-size:12px;letter-spacing:.15em;line-height:2}.placeholder:before{content:"◇";display:block;font-size:39px;color:#a8b2a0}.card-copy{padding:14px 15px 16px}.meta-line{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);gap:6px}.item h2{font-family:Georgia,"Noto Serif TC",serif;font-size:18px;margin:6px 0 7px;line-height:1.5}.item p{font-size:12px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}.tag{display:inline-block;padding:1px 6px;border-radius:3px;background:#e5ebdc;color:#44614c;font-size:11px}.empty{padding:70px 20px;text-align:center;color:var(--muted);grid-column:1/-1;background:#ffffff66;border:1px dashed var(--border);border-radius:10px}footer{margin-top:30px;font-size:12px;color:var(--muted)}footer a{margin-right:16px}dialog{width:min(880px,94vw);max-height:90vh;padding:0;border:1px solid var(--border);border-radius:14px;color:var(--ink);background:var(--card);box-shadow:0 20px 100px #0004}dialog::backdrop{background:#14291fc9}.detail-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:14px 22px;gap:20px}.detail-header span{font-size:12px;color:var(--muted)}.close{background:#eeeedd;color:var(--ink);border:1px solid var(--border);padding:4px 12px;border-radius:5px}.detail-body{padding:24px;display:grid;grid-template-columns:260px 1fr;gap:25px}.detail-visual .thumb{border:1px solid var(--border);border-radius:8px}.detail-art-status{font-size:12px;text-align:center;color:var(--muted);margin:7px 0}.detail-copy h2{font-family:Georgia,"Noto Serif TC",serif;font-size:28px;margin:0 0 7px}.detail-copy>p{font-size:14px;margin:13px 0}.detail-tags{display:flex;flex-wrap:wrap;gap:8px}.detail-copy dl{margin:20px 0 0}.detail-copy dt{font-size:12px;font-weight:700;color:var(--jade);margin:15px 0 4px}.detail-copy dd{margin:0;font-size:14px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1000px){.filters{grid-template-columns:repeat(2,1fr)}.search-label{grid-column:1/-1}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}@media(max-width:620px){header{padding:30px 6vw}main{padding:18px 4vw 32px}.filters{gap:9px}.toolbar{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card-copy{padding:10px}.item h2{font-size:16px}.detail-body{display:block;padding:20px}.detail-visual{max-width:230px;margin:0 auto 18px}.stats span{padding:5px 9px}.stats strong{font-size:18px}.detail-copy h2{font-size:25px}}
.sprite-window{background-repeat:no-repeat;min-width:0;min-height:0;overflow:hidden}
</style>
</head>
<body>
<header><div class="eyebrow">WUXIA ITEM LIBRARY · 重建版</div><h1>江湖藏物誌</h1><p>尋一件趁手兵器，讀一卷師門心法。通用物品與八派傳承分冊收錄，保留各自的用途、來歷與修習取捨。</p><div class="stats" id="stats"></div></header>
<main>
<section class="toolbar" aria-label="物品篩選"><div class="filters">
<label class="search-label">尋找物品<input id="search" type="search" placeholder="名稱、編號、用途或取得方式" autocomplete="off"></label>
<label>收錄範圍<select id="collection"><option value="all">全部物品</option><option value="base">江湖通用</option><option value="sect">門派獨有</option></select></label>
<label>門派<select id="sect"><option value="all">全部門派</option></select></label>
<label>物品類別<select id="category"><option value="all">全部類別</option></select></label>
<label>圖像狀態<select id="art"><option value="all">全部狀態</option><option value="generated">已生成</option><option value="pending">待製作</option></select></label>
</div><div class="toolbar-bottom"><span id="result-count" role="status" aria-live="polite"></span><button class="reset" id="reset" type="button">清除篩選</button></div></section>
<aside id="profile" class="profile" hidden></aside>
<section id="grid" class="grid" aria-label="物品清單"></section>
<footer><p>本圖鑑為重新編寫的設定與美術資料，尚未接入遊戲。門派獨有表示傳承與取得來源，並非一律限制其他門派研習。缺少的圖像會顯示「待製作」。</p><a href="catalog.json" download>下載 JSON</a><a href="catalog.csv" download>下載試算表 CSV</a><a href="CATALOG.txt" download>下載文字圖鑑</a></footer>
</main>
<dialog id="detail" aria-labelledby="detail-name"><div class="detail-header"><span id="detail-id"></span><button class="close" id="close-detail" type="button" aria-label="關閉物品詳情">關閉 ×</button></div><div class="detail-body"><div class="detail-visual"><div id="detail-thumb"></div><p class="detail-art-status" id="detail-art-status"></p></div><div class="detail-copy"><h2 id="detail-name"></h2><div id="detail-tags" class="detail-tags"></div><p id="detail-description"></p><dl id="detail-fields"></dl></div></div></dialog>
<script id="catalog-data" type="application/json">__CATALOG_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('catalog-data').textContent);
const byId=new Map(data.items.map(x=>[x.id,x]));
const sects=new Map(data.sects.map(x=>[x.id,x]));
const $=id=>document.getElementById(id);
const controls=['search','collection','sect','category','art'];
function element(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;}
function addOption(select,value,label){const option=element('option',label);option.value=value;select.append(option);}
for(const p of data.sects)addOption($('sect'),p.id,p.name);
const categories=new Map();for(const item of data.items)categories.set(item.category_id,item.category_name);
for(const [id,name] of categories)addOption($('category'),id,name);
for(const [number,label] of [[data.metadata.base_items,'通用物品'],[data.metadata.sect_items,'門派物品'],[data.sects.length,'大門派'],[data.metadata.generated_images,'件圖像']]){const span=element('span');span.append(element('strong',String(number)),document.createTextNode(label));$('stats').append(span);}
function makeThumb(item){
 const thumb=element('div',undefined,'thumb');thumb.setAttribute('aria-hidden','true');
 if(item.asset_ref&&item.art_status==='generated'){
  const ref=item.asset_ref,url='url("'+encodeURI(ref.image_path).replace(/"/g,'%22')+'")';
  thumb.classList.add('generated');
  if(ref.region){
   const r=ref.region,W=ref.image_width,H=ref.image_height,sprite=element('div',undefined,'sprite-window');
   thumb.style.backgroundImage='none';
   sprite.style.width=(r.width>=r.height?100:r.width/r.height*100)+'%';
   sprite.style.height=(r.height>=r.width?100:r.height/r.width*100)+'%';
   sprite.style.backgroundImage=url;
   sprite.style.backgroundSize=(W/r.width*100)+'% '+(H/r.height*100)+'%';
   sprite.style.backgroundPosition=(W===r.width?0:r.x/(W-r.width)*100)+'% '+(H===r.height?0:r.y/(H-r.height)*100)+'%';
   thumb.append(sprite);
  }else{
   thumb.style.backgroundImage=url;const col=item.cell_index%4,row=Math.floor(item.cell_index/4);
   thumb.style.backgroundPosition=(col*100/3)+'% '+(row*100/3)+'%';
  }
 }else{thumb.append(element('span','圖像待製作','placeholder'));}
 return thumb;
}
function showDetail(id){const item=byId.get(id);if(!item)return;$('detail-id').textContent=item.id+' · '+(sects.get(item.sect_id)?.name||'江湖通用');$('detail-name').textContent=item.name;$('detail-thumb').replaceChildren(makeThumb(item));$('detail-art-status').textContent=item.art_status==='generated'?'圖像已生成':'圖像待製作 · 下方已附外觀設定';$('detail-description').textContent=item.description;$('detail-tags').replaceChildren(...[item.category_name,item.tier,sects.get(item.sect_id)?.name||'通用'].map(x=>element('span',x,'tag')));const fields=$('detail-fields');fields.replaceChildren();for(const [key,label] of [['use','用途與修習方向'],['limitation','限制與取捨'],['acquisition','取得途徑'],['appearance','外觀設定']]){fields.append(element('dt',label),element('dd',item[key]));}$('detail').showModal();}
function render(){const query=$('search').value.trim().toLocaleLowerCase();const col=$('collection').value,sect=$('sect').value,cat=$('category').value,art=$('art').value;const results=data.items.filter(x=>(col==='all'||x.collection===col)&&(sect==='all'||x.sect_id===sect)&&(cat==='all'||x.category_id===cat)&&(art==='all'||x.art_status===art)&&(!query||[x.id,x.name,x.description,x.use,x.acquisition,x.appearance,x.category_name,sects.get(x.sect_id)?.name||''].join(' ').toLocaleLowerCase().includes(query)));$('result-count').textContent='顯示 '+results.length+'／'+data.items.length+' 件物品';const fragment=document.createDocumentFragment();if(!results.length)fragment.append(element('div','沒有符合的物品。可以縮短關鍵字，或清除部分篩選。','empty'));for(const item of results){const article=element('article',undefined,'item');const button=element('button',undefined,'open-item');button.type='button';button.setAttribute('aria-label','查看 '+item.name+' 詳情');button.addEventListener('click',()=>showDetail(item.id));button.append(makeThumb(item));const copy=element('div',undefined,'card-copy');const meta=element('div',undefined,'meta-line');meta.append(element('span',item.id),element('span',sects.get(item.sect_id)?.name||'江湖通用','tag'));copy.append(meta,element('h2',item.name),element('p',item.category_name+' · '+item.use));button.append(copy);article.append(button);fragment.append(article);}$('grid').replaceChildren(fragment);const profile=sects.get(sect);$('profile').hidden=!profile;if(profile){$('profile').replaceChildren(element('strong',profile.name+' · '),document.createTextNode(profile.positioning+'　取捨：'+profile.tradeoff));}}
for(const id of controls)$(id).addEventListener(id==='search'?'input':'change',()=>{if(id==='sect'&&$('sect').value!=='all')$('collection').value='sect';if(id==='collection'&&$('collection').value==='base')$('sect').value='all';render();});
$('reset').addEventListener('click',()=>{for(const id of controls)$(id).value=id==='search'?'':'all';render();$('search').focus();});
$('close-detail').addEventListener('click',()=>$('detail').close());
$('detail').addEventListener('click',event=>{if(event.target===$('detail')){const box=$('detail').getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)$('detail').close();}});
render();
</script>
</body></html>
